# Segmentation settings: the detector that finds a box for a text prompt (Grounding DINO), and the
# segmenter that turns a box into an object mask (SAM 2.1). They are used for the ABO photos (which
# have no masks), for the end-to-end evaluation, and for the demo. Paths are relative to the
# repository root. scripts/00_download_weights.py downloads the listed files into "folder".
segment:
  detector:                          # Grounding DINO tiny: text ("chair") -> boxes with confidences
    hub_repo: IDEA-Research/grounding-dino-tiny
    revision: a2bb814dd30d776dcf7e30523b00659f4f141c71     # fixed commit of the model repository
    folder: weights/grounding_dino/grounding-dino-tiny
    files:                           # name: size in bytes (checked after the download)
      config.json: 1644
      model.safetensors: 689359096
      preprocessor_config.json: 457
      tokenizer.json: 711396
      tokenizer_config.json: 1237
      special_tokens_map.json: 125
      added_tokens.json: 82
      vocab.txt: 231508
    box_threshold: 0.35              # boxes with a lower confidence are ignored
    text_threshold: 0.25             # how strongly a box must match the words of the prompt
  segmenter:                         # SAM 2.1 large (217 M parameters): image + box -> object mask. The active
                                     # segmenter of every step. Chosen over small in notebooks/06_mask_variants.py:
                                     # +2.7 points of zero-shot R@1 on 1,500 Pix3D tuning photos (60.7 against 58.0);
                                     # GPU about 1.3 GB, 0.54 s per photo (small: 0.5 GB, 0.16 s)
    hub_repo: facebook/sam2.1-hiera-large
    revision: 665f8e2ad61cf5f53d65644ff27c8ee525124610
    folder: weights/sam2/sam2.1-hiera-large
    files:                           # name: size in bytes (checked after the download)
      config.json: 5705
      model.safetensors: 897897416
      preprocessor_config.json: 683
      processor_config.json: 95
    box_mask: single                 # mask for a box prompt: "single" (SAM's one-mask output) or "largest"
                                     # (the largest of SAM's three candidates; it did not help); see src/preprocess/segment.py
    precision: fp16                  # fp16 on the GPU: 2.5 x faster than fp32 (0.22 s against 0.53 s per photo), masks the same
                                     # (median agreement 0.9999; IoU change at most 0.002 on 60 photos). The CPU always uses fp32
  segmenter_small:                   # SAM 2.1 small (39 M parameters): kept for comparisons and for fast tests on the CPU.
                                     # Download: python scripts/00_download_weights.py --models segmenter_small
    hub_repo: facebook/sam2.1-hiera-small
    revision: ee5bba1d82bb8749febdf90f45e84b687142ba03
    folder: weights/sam2/sam2.1-hiera-small
    files:
      config.json: 5698
      model.safetensors: 184305280
      preprocessor_config.json: 683
      processor_config.json: 95
    box_mask: single
    precision: fp16
  photo_check:                       # SigLIP base (203 M parameters): image + texts -> which text fits the image. For the ABO
                                     # photo cleaning: does an extra product image show the whole object, or only a part, a
                                     # drawing, a swatch? A separate model: it never takes part in the search.
                                     # Download: python scripts/00_download_weights.py --models photo_check
    hub_repo: google/siglip-base-patch16-224
    revision: 7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed
    folder: weights/siglip/siglip-base-patch16-224
    files:
      config.json: 432
      model.safetensors: 812672320
      preprocessor_config.json: 368
      special_tokens_map.json: 409
      tokenizer.json: 2399357
      tokenizer_config.json: 711

  # Detector text for the classes whose folder name is not plain English. Other classes use their
  # name with spaces for underscores ("ceiling_light" -> "ceiling light."). To be checked on the ABO photos.
  prompts:
    bean_bag: bean bag chair
    tv_stand: tv stand
    basket_bin: basket
    planter: plant pot

  # ABO photo cleaning: a photo is kept only if all rules pass (the detector threshold above is rule 1).
  # Chosen on a sample of 20 random photos per class (notebooks/03_abo_check.py, section 7).
  cleaning:
    max_edges_touched: 2             # close-up: the box touches 3 or 4 photo edges ...
    close_up_box_share: 0.6          # ... or touches any edge and covers at least 60 % of the photo (a crop that fills
                                     # the frame; an object cut by the frame of a room photo has a smaller box)
    min_box_side: 0.3                # too small: the longer box side is under 30 % of the longer photo side ...
    min_box_pixels: 112              # ... or under 112 pixels (the 224-pixel query would be enlarged more than 2 x).
                                     # The box, not the mask: a floor lamp spans the photo, but its pole covers 3 %
    min_mask_area: 0.01              # the mask must cover at least 1 % of the photo (SAM found something) ...
    max_mask_area: 0.90              # ... and at most 90 % (a swatch or texture that fills the frame)
    background:                      # SAM sometimes masks the white background of a product photo instead of the object
      near_white_level: 235          # a pixel is near-white if all three colour values are at least this (of 255)
      white_share_above: 0.8         # background mask: at least 80 % of its pixels are near-white ...
      coverage_below: 0.5            # ... and it covers less than half of the coloured pixels in the box
      repair_white_share_below: 0.5  # a SAM candidate replaces it if under 50 % of its pixels are near-white ...
      repair_coverage_above: 0.6     # ... and it covers at least 60 % of the coloured pixels; else background_mask

  # Quality check against reference masks (Pix3D).
  check:
    edge_band_fraction: 0.005        # the edge-tolerant IoU ignores pixels this close to the reference edge
                                     # (0.5 % of the longer photo side: 3 pixels at 640 pixels)
