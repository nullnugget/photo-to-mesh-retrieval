# Re-ranking settings: a second look at the first candidates of the search (stage 2).
# Stage 1 (the search with the trained heads) gives a short list of meshes for a photo; stage 2 compares
# the photo with each listed mesh in more detail and changes the order.
rerank:
  patches:                           # the patch store (src/models/patch_store.py): 196 patch vectors per image
    dim: 128                         # numbers per stored patch vector, after PCA from 768 (64 = the first 64 of these)
    fit_images: 3000                 # images of each kind (renders, photos) for the PCA fit; non-test images only
    object_share: 0.5                # a patch is "on the object" when at least this share of its pixels is not background
    seed: 0                          # the random choice of the fit images
    size: 448                        # side length of the images that the backbone sees: 448 (28 x 28 = 784 patches, from
                                     # renders_448/ and queries_448/; method 1 gains more with it than with 224, most on ABO)
                                     # or 224 (14 x 14 = 196 patches, the main images). One store per size,
                                     # data/derived/patches/<backbone>[_<size>]/; the re-ranking reads the store of this size
  candidates:                        # the stage-1 lists (src/retrieval/candidates.py)
    top: 50                          # meshes kept per photo (method 1 uses the first 10; more for later checks)
  method1:                           # patch-by-patch comparison, no training (src/retrieval/patch_rerank.py)
    top: 10                          # candidates re-ordered per photo
    views: 5                         # views per candidate: the best ones by the stage-1 view score
    dims: [64, 128]                  # numbers per patch vector that are compared (the first d of the stored ones)
    weights: [0.0, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5, 0.75, 1.0, 1.5, 2.0]
                                     # final score = stage-1 score + weight * patch score; the weight is chosen
                                     # on the cross-validation folds, like the mix weight
  gallery:                           # the patch comparison as a stage 1, against every mesh (no shortlist; a check)
    photos: 500                      # random val photos per dataset (SAM query images)
    dims: [64]                       # numbers per patch vector
    seed: 0
  dimcheck:                          # the cost of the PCA reduction for method 1 (raw 768 numbers, a sample; a check)
    photos: 500                      # random val photos per dataset (SAM query images)
    dims: [64, 128]                  # compared with the raw 768
    seed: 1
  sizecheck:                         # method 1 with patches of larger images (raw 768 numbers, a sample; a check)
    sizes: [224, 336, 448]           # side lengths that the backbone sees: 196, 441, 784 patches per image
    source_size: 448                 # the other sizes are shrunk in memory from the images of this size; the main
                                     # size (data.image_size) comes from its own folders
    photos: 500                      # random val photos per dataset (SAM query images); with the seed of dimcheck,
    seed: 1                          # the same photos, so that its 768-number row is repeated at 224
  method2:                           # learned re-ranker (src/models/reranker.py, src/pipeline/train_reranker.py)
    variant: residual_method1        # residual_method1: stage 1 + method1_weight x method 1 + r; stage1: stage 1 + r
    method1_weight: 1.0              # the weight of method 1 (chosen in its cross-validation)
    top: 10                          # meshes re-ordered per photo (the first 10 of stage 1, as method 1)
    views: 5                         # views per mesh: the best ones by the stage-1 view score
    tokens: 256                      # object patches per image at most (median 240 to 320 at 448 pixels; a random
                                     # choice when there are more; a fixed-seed choice in evaluation). 256, not 384:
                                     # 19.3 against 13.3 training photos per second (the pair scorer is the cost)
    width: 256                       # the pair scorer: token width, attention heads, blocks, feed-forward width
    heads: 4
    blocks: 2
    ffn: 1024
    tau: 0.05                        # temperature of the loss over the 11 candidates of a training photo
    epochs: 5
    batch_photos: 4                  # training photos per step (each with 11 candidates x 5 views = 55 pairs)
    eval_photos: 8                   # photos per evaluation pass
    eval_epochs: all                 # all: measure the val photos after every epoch (the epoch curve); last: only at the end
    lr: 3.0e-4
    weight_decay: 1.0e-4
    warmup_epochs: 1
    loader_workers: 4
    seed: 0
    mini: {train_photos: 200, val_photos: 100}   # the mini run: 1 fold, 1 epoch, these photo counts
