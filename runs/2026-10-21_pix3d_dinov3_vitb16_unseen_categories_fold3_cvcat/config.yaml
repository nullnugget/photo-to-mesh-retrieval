data:
  datasets:
  - pix3d
  image_size: 224
  background_rgb:
  - 128
  - 128
  - 128
  crop_margin: 0.0
  splits:
    seed: 42
    seen_meshes:
      test_fraction: 0.15
      val_fraction: 0.1
    unseen_meshes:
      fractions:
        train: 0.7
        val: 0.1
        test: 0.2
      cross_validation: 5
    unseen_categories:
      val_fraction: 0.1
      cross_validation: by_category
      held_out:
        pix3d:
        - bookcase
        - wardrobe
        abo:
        - lamp
        - planter
        - vase
        - ceiling_light
  pix3d:
    v1_test_part: true
    v1_seed: 42
    v1_holdout_fraction: 0.15
  abo:
    max_models_per_class: null
    photos: original
    download_workers: 16
    retries: 5
    class_rules:
    - product_type: CHAIR
      class: chair
    - product_type: SOFA
      class: sofa
    - product_type: TABLE
      class: table
    - product_type: DESK
      class: desk
    - product_type: BED
      class: bed
    - product_type: BED_FRAME
      class: bed
    - product_type: CABINET
      class: cabinet
    - product_type: SHELF
      class: shelf
    - product_type: DRESSER
      class: dresser
    - product_type: STOOL_SEATING
      class: stool
    - product_type: OTTOMAN
      class: ottoman
    - product_type: BENCH
      class: bench
    - product_type: BEAN_BAG_CHAIR
      class: bean_bag
    - product_type: HOME_FURNITURE_AND_DECOR
      leaf: Media Storage|Television Stands
      class: tv_stand
    - product_type: HOME_FURNITURE_AND_DECOR
      leaf: Bar & Serving Carts|Kitchen Islands
      class: cart
    - product_type: LAMP
      class: lamp
    - product_type: LIGHT_FIXTURE
      class: ceiling_light
    - product_type: PLANTER
      class: planter
    - product_type: VASE
      class: vase
    - product_type: ELECTRIC_FAN
      class: fan
    - product_type: SPORTING_GOODS
      leaf: Dumbbells
      class: dumbbell
    - product_type: CLOTHES_RACK
      class: clothes_rack
    - product_type: STORAGE_BOX
      class: storage_box
    - product_type: AIR_CONDITIONER
      class: air_conditioner
    - product_type: LADDER
      class: ladder
    - product_type: HOME
      leaf: Baskets, Bins
      class: basket_bin
    - product_type: HOME
      leaf: Space Heaters
      class: space_heater
    - product_type: CLOCK
      class: clock
    class_overrides:
      B07BWK7FXW: sofa
      B07BWMSLWY: sofa
      B07QSC1TBQ: chair
      B079VNL3GM: dresser
render:
  front_axis:
    pix3d: -z
    abo: +z
  rig: rings25
  rings:
  - elevation_deg: -15
    count: 8
    azimuth_offset_deg: 0.0
  - elevation_deg: 15
    count: 8
    azimuth_offset_deg: 22.5
  - elevation_deg: 45
    count: 8
    azimuth_offset_deg: 0.0
  top:
    elevation_deg: 85
    count: 1
  fov_deg: 40
  distance_margin: 1.05
  render_size: 512
  output_size: 224
  max_faces_per_batch: 2000000
  simplify_above_faces: 1000000
  simplify_cell: 0.004
  crop_margin: 0.0
  background_rgb:
  - 128
  - 128
  - 128
  material:
    albedo: 0.7
    shininess: 10
    use_textures: false
    normals: crease
    crease_deg: 30
  lighting: L2_dark
  lighting_presets:
    L0:
      type: point_at_camera
      ambient: 0.5
      diffuse: 0.3
      specular: 0.2
    L1:
      type: point_at_camera
      ambient: 0.35
      diffuse: 0.55
      specular: 0.05
    L2:
      type: directional_camera_relative
      elevation_deg: 35
      azimuth_deg: -35
      ambient: 0.3
      diffuse: 0.65
      specular: 0.05
    L3:
      type: key_and_fill
      key:
        elevation_deg: 35
        azimuth_deg: -35
        diffuse: 0.6
      fill:
        elevation_deg: 10
        azimuth_deg: 45
        diffuse: 0.25
      ambient: 0.25
      specular: 0.05
    L4:
      type: directional_world
      direction:
      - 0.0
      - -1.0
      - 0.0
      ambient: 0.35
      diffuse: 0.6
      specular: 0.05
    L2_bright:
      type: directional_camera_relative
      elevation_deg: 35
      azimuth_deg: -35
      ambient: 0.82
      diffuse: 0.6
      specular: 0.05
    L2_dark:
      type: directional_camera_relative
      elevation_deg: 35
      azimuth_deg: -35
      ambient: 0.08
      diffuse: 0.55
      specular: 0.0
backbone:
  name: dinov3_vitb16
  feature_recipe: cls
  zero_shot:
    scoring: combined
    alpha: 0.75
  precision: fp16
  batch_size: 64
  loader_workers: 4
  image_size: 224
  normalize:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  available:
    dinov3_vits16:
      hub: facebookresearch/dinov3:6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
      dim: 384
      patch_size: 16
    dinov3_vitb16:
      hub: facebookresearch/dinov3:6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
      dim: 768
      patch_size: 16
    dinov3_vitl16:
      hub: facebookresearch/dinov3:6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
      dim: 1024
      patch_size: 16
    dinov2_vitb14_reg:
      hub: facebookresearch/dinov2:7764ea0f912e53c92e82eb78a2a1631e92725fc8
      weights: weights/dinov2/dinov2_vitb14_reg4_pretrain.pth
      dim: 768
      patch_size: 14
train:
  seed: 42
  batch_size: 64
  epochs: 5
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.0001
  schedule:
    name: cosine
    warmup_epochs: 1
  heads:
    design: residual
    embedding_dim: 256
    hidden_dim: 512
    aggregator: attention
    attention_dim: 128
    view_dropout_min_views: 12
  loss:
    temperature: 0.05
    category_weight: 0.3
  scoring:
    alpha: 0.5
    mix_weight: 0.75
    view_max: hard
  query_images:
    pix3d:
    - reference
    - sam
    abo:
    - sam
  augment:
    color_jitter:
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
    grayscale_p: 0.4
    rotation_deg: 10
    zoom_out_min: 0.85
    erasing_p: 0.25
    mask_noise:
      enabled: true
      p: 0.5
      erode:
      - 0.005
      - 0.015
      holes_max: 2
      hole_radius:
      - 0.015
      - 0.035
    hflip_p: 0.0
  select_by: val_r1
  mini_fraction: 0.05
