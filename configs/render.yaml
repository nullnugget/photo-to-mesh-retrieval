# Render settings: the cameras, the image size, the material, and the lights used to render every 3D mesh.
# Each render run writes a copy of these settings to data/derived/renders/render_config.yaml.
render:
  front_axis: {pix3d: "-z", abo: "+z"}   # the direction each dataset's meshes face; every mesh is turned to face +Z (view 0 = front)
  rig: rings25                       # rings25 = 3 rings of 8 cameras + 1 top camera; icosahedron12 = the v1 rig
  rings:                             # elevation = camera angle above the horizontal plane through the mesh centre
    - {elevation_deg: -15, count: 8, azimuth_offset_deg: 0.0}
    - {elevation_deg: 15, count: 8, azimuth_offset_deg: 22.5}    # offset, so its cameras sit between the others
    - {elevation_deg: 45, count: 8, azimuth_offset_deg: 0.0}
  top: {elevation_deg: 85, count: 1}                             # 85, not 90: "look at" is undefined straight down
  fov_deg: 40                        # camera field of view
  distance_margin: 1.05              # camera distance = margin / sin(fov / 2); meshes are scaled to a unit sphere
  render_size: 512                   # side length (pixels) of the raw render, before the crop
  output_size: 224                   # side length after the crop to the object, square padding, and resize
  max_faces_per_batch: 2000000       # GPU memory budget: views rendered together = this / faces of the mesh (1 to 25)
  simplify_above_faces: 1000000      # meshes with more triangles are simplified first (vertices closer than one pixel merged)
  simplify_cell: 0.004               # grid cell of that simplification, in unit-sphere units: about one pixel of the raw render
  crop_margin: 0.0                   # must be the same as data.crop_margin
  background_rgb: [128, 128, 128]    # must be the same as data.background_rgb
  material:
    albedo: 0.7                      # brightness of the grey material that every mesh gets
    shininess: 10                    # size of the highlights (higher = smaller, sharper highlights)
    use_textures: false              # false = ignore the mesh textures; all meshes look the same grey
    normals: crease                  # crease = smooth, but sharp edges stay sharp; smooth = all edges blended; flat = one normal per triangle
    crease_deg: 30                   # in crease mode: neighbouring triangles that meet at a larger angle are not blended
  lighting: L2                       # name of the active preset below
  lighting_presets:                  # light setups to compare; select one with --set render.lighting=<name>
    L0: {type: point_at_camera, ambient: 0.5, diffuse: 0.3, specular: 0.2}            # the v1 setup
    L1: {type: point_at_camera, ambient: 0.35, diffuse: 0.55, specular: 0.05}         # v1 position, less glare
    L2: {type: directional_camera_relative, elevation_deg: 35, azimuth_deg: -35, ambient: 0.3, diffuse: 0.65, specular: 0.05}
    L3:                                                                                # main light plus a weaker fill light
      type: key_and_fill
      key: {elevation_deg: 35, azimuth_deg: -35, diffuse: 0.6}
      fill: {elevation_deg: 10, azimuth_deg: 45, diffuse: 0.25}
      ambient: 0.25
      specular: 0.05
    L4: {type: directional_world, direction: [0.0, -1.0, 0.0], ambient: 0.35, diffuse: 0.6, specular: 0.05}   # light from above
    # L2 with its brightness range moved away from the background grey (128), so that no object pixel
    # can have the background value. Brightness = 255 x (albedo x (ambient + diffuse x cos) + highlight).
    L2_bright: {type: directional_camera_relative, elevation_deg: 35, azimuth_deg: -35, ambient: 0.82, diffuse: 0.6, specular: 0.05}  # 146 to 255
    L2_dark: {type: directional_camera_relative, elevation_deg: 35, azimuth_deg: -35, ambient: 0.08, diffuse: 0.55, specular: 0.0}    # 14 to 112
