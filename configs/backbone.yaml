# Frozen backbone for feature extraction (design guide 02, section 12). Paths are relative to the repository root.
# The code is loaded from the builder functions in <repo>/<package>/hub/backbones.py, not from hubconf.py (decision D36).
backbone:
  name: dinov3_vitb16                # main backbone (decision D07); experiment E2 compares the others
  feature_recipe: cls                # OPEN: cls, masked_mean, or cls_masked_mean (experiment E2)
  precision: fp16                    # fp16 matches fp32 (L-0016)
  batch_size: 64
  image_size: 224
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  available:
    dinov3_vits16:
      repo: third_party/dinov3
      commit: 6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
      dim: 384
      patch_size: 16
    dinov3_vitb16:
      repo: third_party/dinov3
      commit: 6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
      dim: 768
      patch_size: 16
    dinov3_vitl16:
      repo: third_party/dinov3
      commit: 6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
      dim: 1024
      patch_size: 16
    dinov2_vitb14_reg:
      repo: third_party/dinov2
      commit: 7764ea0f912e53c92e82eb78a2a1631e92725fc8
      weights: weights/dinov2/dinov2_vitb14_reg4_pretrain.pth
      dim: 768
      patch_size: 14
