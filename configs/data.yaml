# Data settings: which datasets to use, how query images are prepared, and how the data is split.
# Paths are relative to the repository root.
data:
  datasets: [pix3d]                  # datasets to use; add "abo" to train on Pix3D and ABO together
  image_size: 224                    # side length (pixels) of every query image and every render
  background_rgb: [128, 128, 128]    # neutral grey that replaces the background of queries and renders
  crop_margin: 0.0                   # extra border around the object before the square crop (0.0 = tight crop)

  splits:                            # files: data/splits/<dataset>/<split name>.json
    seed: 42                         # fixed seed, so that every split is repeatable
    seen_meshes:                     # photos split at random; most test meshes also have training photos
      test_fraction: 0.15            # share of each category's photos in the test part (if no fixed test part)
      val_fraction: 0.10             # share of each category's other photos kept apart to select checkpoints
    unseen_meshes:                   # meshes split; no photo of a test mesh is used in training
      fractions: {train: 0.70, val: 0.10, test: 0.20}
      cross_validation: 5            # 5 folds of the non-test meshes (data/splits/<dataset>/unseen_meshes_fold<k>.json)
    unseen_categories:               # whole categories kept out of training
      val_fraction: 0.10
      cross_validation: by_category  # one fold per non-test category (leave one category out; unseen_categories_fold<k>.json)
      held_out:
        pix3d: [bookcase, wardrobe]
        abo: [lamp, planter, vase, ceiling_light]
      # Near relatives: categories that are nearly the same object as a held-out category. Every
      # unseen_categories training (also each fold of its cross-validation) leaves out the photos
      # of the relatives of its held-out categories, in every dataset; otherwise the model would
      # learn the held-out category through them (src/data/splits.py, left_out_categories).
      relatives:
        bookcase: [shelf, tv_stand]   # ABO shelves; ABO TV stands are low cabinets and open shelves
        wardrobe: [cabinet, dresser]  # closed boxes with doors or drawers
        chair: [stool, bench, bean_bag]
        sofa: [ottoman, bench]
        table: [cart]                 # ABO carts are kitchen islands and bar carts

  pix3d:
    v1_test_part: true               # seen_meshes: use the v1 evaluation photos as the test part (comparable with v1)
    v1_seed: 42                      # the v1 code shuffled the pix3d.json entries with this seed ...
    v1_holdout_fraction: 0.15        # ... and evaluated the last 15 % of the shuffled list

  abo:
    max_models_per_class: null       # null = use every model of each class
    photos: original                 # "original" = full-resolution catalog photos; "small" = 256-pixel versions
    download_workers: 16             # parallel downloads; each worker reuses its HTTPS connection
    retries: 5                       # attempts for each file before it is reported as failed
    # Class rules: they turn an ABO product type into one of our classes. The first matching rule wins.
    # "leaf" is a regular expression that must match the last part of the Amazon category path
    # (field node[0].node_name), for product types that mix several kinds of objects.
    class_rules:
      - {product_type: CHAIR, class: chair}
      - {product_type: SOFA, class: sofa}
      - {product_type: TABLE, class: table}
      - {product_type: DESK, class: desk}
      - {product_type: BED, class: bed}
      - {product_type: BED_FRAME, class: bed}
      - {product_type: CABINET, class: cabinet}
      - {product_type: SHELF, class: shelf}
      - {product_type: DRESSER, class: dresser}
      - {product_type: STOOL_SEATING, class: stool}
      - {product_type: OTTOMAN, class: ottoman}
      - {product_type: BENCH, class: bench}
      - {product_type: BEAN_BAG_CHAIR, class: bean_bag}
      - {product_type: HOME_FURNITURE_AND_DECOR, leaf: "Media Storage|Television Stands", class: tv_stand}
      - {product_type: HOME_FURNITURE_AND_DECOR, leaf: "Bar & Serving Carts|Kitchen Islands", class: cart}
      - {product_type: LAMP, class: lamp}
      - {product_type: LIGHT_FIXTURE, class: ceiling_light}
      - {product_type: PLANTER, class: planter}
      - {product_type: VASE, class: vase}
      - {product_type: ELECTRIC_FAN, class: fan}
      - {product_type: SPORTING_GOODS, leaf: "Dumbbells", class: dumbbell}
      - {product_type: CLOTHES_RACK, class: clothes_rack}
      - {product_type: STORAGE_BOX, class: storage_box}
      - {product_type: AIR_CONDITIONER, class: air_conditioner}
      - {product_type: LADDER, class: ladder}
      - {product_type: HOME, leaf: "Baskets, Bins", class: basket_bin}
      - {product_type: HOME, leaf: "Space Heaters", class: space_heater}
      - {product_type: CLOCK, class: clock}
    # Class overrides: product id (ASIN) -> class. They correct products whose Amazon metadata has a
    # wrong product type. An override wins over the class rules; Amazon's files stay unchanged.
    #
    # What they do: `abo.select` (src/data/abo.py) looks up each product id here before it applies the
    # class rules. The class of an override is used for everything that comes after: the mesh id
    # ("abo/sofa/B07BWK7FXW"), the folders of the mesh and photo files, the catalog, and the renders.
    # The manifest keeps Amazon's own product type in its "product_type" column, so the correction
    # stays visible.
    #
    # Why here and not in the metadata files: data/raw/ is not in git, so a new download would bring
    # back the wrong labels without a warning; an edit inside the gzipped files has no record of what
    # changed or why; and the raw files stay a reference copy of what the dataset authors published.
    #
    # How they were found: these products have the same geometry as another product (colour variants
    # of one item; see src/pipeline/catalog_abo_meshes.py), but Amazon gives the copies different
    # product types. The product names show which label is correct. Every wrong copy is listed, so
    # that each geometry group has one class. Add a product here when a check shows another wrong
    # label, and run the catalog stage again (see the module description of src/data/abo.py).
    class_overrides:
      B07BWK7FXW: sofa      # "Stone & Beam Andover Leather Left-Facing Sofa-Chaise Sectional"; Amazon: CHAIR
      B07BWMSLWY: sofa      # the same sofa in another colour; Amazon: CHAIR (a third colour is SOFA)
      B07QSC1TBQ: chair     # "Movian Arendsee Dining Chairs"; Amazon: STOOL_SEATING (its copy is CHAIR)
      B079VNL3GM: dresser   # "Movian High Gloss 2 Drawer Bedside Cabinet" (a nightstand with drawers); Amazon: TABLE
