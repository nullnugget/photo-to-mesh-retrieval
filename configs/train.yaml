# Training settings (design guide 02, sections 13-16). Start values, PROPOSED; tuned on the validation set (task T5.10).
train:
  seed: 42
  batch_size: 64                     # queries per step; the loss uses all gallery shapes as negatives
  epochs: 30
  optimizer: {name: adamw, lr: 1.0e-3, weight_decay: 1.0e-4}
  schedule: {name: cosine, warmup_epochs: 1}
  heads:                             # embedding heads: QueryProjector, ViewProjector, ViewAggregator
    embedding_dim: 256
    hidden_dim: 512
    aggregator: attention            # attention or mean (ablation E9)
    view_dropout_min_views: 12       # random subset of 12-25 views for the aggregator during training
  loss:
    temperature: 0.1
    category_weight: 0.3             # lambda in L = L_inst + lambda * L_cat
  scoring:
    alpha: 0.5                       # combined score = alpha * view score + (1 - alpha) * shape score
    view_max: hard                   # hard or soft (log-sum-exp) maximum over views
  augment:
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.1}
    grayscale_p: 0.4
    rotation_deg: 10
    zoom_out_min: 0.85
    erasing_p: 0.25
    mask_noise: true
    hflip_p: 0.0                     # only as a test (asymmetric shapes)
  select_by: val_r1                  # checkpoint selection (decision D19)
  mini_fraction: 0.05                # data fraction for --mini runs
