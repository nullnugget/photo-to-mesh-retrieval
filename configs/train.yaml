# Training settings for the three embedding heads (query projector, view projector, view aggregator).
# These are start values; they are tuned on the validation set.
train:
  seed: 42                           # fixed seed, so that a run can be repeated
  batch_size: 64                     # query images per step; every mesh of the training gallery is a negative in each step
  epochs: 5                          # a short training: longer ones learn the training meshes and lose on new meshes
                                     # (5-fold cross-validation by mesh: 10 epochs worse than 5; 30 epochs worse still)
  final_epoch: last                  # the epoch of the final model: last, or best (the best mean val R@1); a cross-validation
                                     # reports its pooled result at this epoch (last: the curve is flat, and a final
                                     # training on all non-test photos has no val part to choose an epoch)
  optimizer: {name: adamw, lr: 3.0e-4, weight_decay: 1.0e-4}   # lr 3e-4: the trained score on new meshes is flat over the epochs
  schedule: {name: cosine, warmup_epochs: 1}   # learning rate rises for 1 epoch, then falls along a cosine curve
  heads:
    design: residual                 # projection (768 -> 256, new space), residual (feature + correction, both sides),
                                     # or query_residual (photo side only; gallery = raw features); see src/models/embedding_heads.py
    embedding_dim: 256               # length of every embedding (query, view, and mesh); projection only (the residual designs keep 768)
    hidden_dim: 512                  # width of the hidden layer in each projector
    aggregator: attention            # how 25 view embeddings become 1 mesh embedding: attention or mean
    attention_dim: 128               # attention: width of the rating network (Linear embedding_dim -> 128, tanh, dot with a learned vector)
    view_dropout_min_views: 12       # during training, the aggregator sees a random 12 to 25 views
  loss:
    temperature: 0.05                # divides the scores before the softmax; smaller = sharper probabilities (0.05 selected on val; 0.1 was the start value)
    category_weight: 0.3             # weight of the category loss in: loss = instance loss + weight * category loss
  scoring:
    alpha: 0.5                       # score = alpha * best-view score + (1 - alpha) * mesh score
    mix_weight: 0.75                 # final score = mix_weight * trained score + (1 - mix_weight) * zero-shot score
                                     # (zero-shot score: the raw features with backbone.zero_shot). 1.0 = trained score only.
                                     # The mix keeps the general knowledge of the frozen features for meshes that the
                                     # training never saw. It applies to validation (checkpoint selection) and evaluation.
                                     # 0.75: the best mean of seen meshes and new meshes (with the residual design, 5 epochs).
    view_max: hard                   # best-view score: hard = plain maximum; soft = log-sum-exp (smooth maximum)
  query_images:                      # the prepared query images that a training photo can use; one at random at each use
    pix3d: [reference, sam]          # reference = the catalog image (Pix3D masks); sam = the image made with the SAM mask
    abo: [sam]                       # ABO has only SAM masks (the catalog image is the SAM one)
  augment:                           # random changes to training query images
    color_jitter: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.1}
    grayscale_p: 0.4                 # probability to make an image grey, so that the model relies on form
    rotation_deg: 10                 # maximum in-plane rotation
    zoom_out_min: 0.85               # the object can shrink to 85 % of the frame
    erasing_p: 0.25                  # probability to cover a small rectangle (imitates occlusion)
    mask_noise:                      # small random changes to the object outline (imitates imperfect masks)
      enabled: true
      p: 0.5                         # share of the uses with noise
      erode: [0.005, 0.015]          # the outline moves inwards by 1 to 3 pixels of 224 (more removes thin legs completely)
      holes_max: 2                   # 0 to 2 small holes in the object
      hole_radius: [0.015, 0.035]    # radius of a hole: 3 to 8 pixels of 224
    hflip_p: 0.0                     # horizontal flip; off, because some meshes are not mirror-symmetric
  select_by: val_r1                  # keep the checkpoint with the best validation recall@1
  mini_fraction: 0.05                # fraction of the data used by quick --mini runs
