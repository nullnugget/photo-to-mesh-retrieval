# Backbone settings: the frozen, pretrained network that turns each image into a feature vector.
# Paths are relative to the repository root.
backbone:
  name: dinov3_vitb16                # active backbone; must be one of the entries under "available"
  feature_recipe: cls                # how one feature vector is made from the backbone output:
                                     #   cls             = the class token (a summary of the whole image)
                                     #   masked_mean     = the mean of the patch tokens that lie on the object
                                     #   cls_masked_mean = both, joined
                                     # selected on the test-free photos (zero-shot comparison of the four backbones)
  zero_shot:                         # scoring of the raw features, without trained heads (evaluation defaults)
    scoring: combined                # view, mesh, or combined score
    alpha: 0.75                      # weight of the view score; selected on the test-free photos (0.75 to 0.9 equal).
                                     # Zero-shot only: after training, alpha is tuned on each split's val part.
  precision: fp16                    # fp16 gives the same features as fp32 at half the memory
  batch_size: 64                     # images processed together during feature extraction
  loader_workers: 4                  # processes that read the image files while the GPU works
  image_size: 224                    # input side length in pixels
  normalize:                         # ImageNet colour normalization, which the backbones expect
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  available:                         # every backbone that the code can load
    # hub:        source of the model code for torch.hub.load, as "<github owner>/<repo>:<commit>".
    #             The code (no weights) is downloaded once into ~/.cache/torch/hub/ and reused.
    # weights:    local weights file; loaded instead of any download (the builder gets pretrained=False)
    # dim:        length of the feature vector
    # patch_size: side length (pixels) of one image patch
    dinov3_vits16:
      hub: facebookresearch/dinov3:6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
      dim: 384
      patch_size: 16
    dinov3_vitb16:
      hub: facebookresearch/dinov3:6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
      dim: 768
      patch_size: 16
    dinov3_vitl16:
      hub: facebookresearch/dinov3:6876159a11b4df116f30f667f8c9888617df0751
      weights: weights/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
      dim: 1024
      patch_size: 16
    dinov2_vitb14_reg:
      hub: facebookresearch/dinov2:7764ea0f912e53c92e82eb78a2a1631e92725fc8
      weights: weights/dinov2/dinov2_vitb14_reg4_pretrain.pth
      dim: 768
      patch_size: 14
